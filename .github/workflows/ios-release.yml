name: Build and Distribute Swift iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# 与 .xcodeproj 同级放置此目录和 ExportOptions.plist。
# 留空时自动识别根目录中的 workspace/project 和唯一的 Scheme。
env:
  XCODE_VERSION: '27.0'
  IOS_CONTAINER: 'HomeMeasure.xcodeproj'
  IOS_SCHEME: 'HomeMeasure'
  IOS_CONFIGURATION: Release

jobs:
  build:
    name: Archive and upload Swift iOS app
    # Xcode 27 使用专用 runner；macos-26 镜像仍提供 Xcode 26。
    # https://github.com/actions/runner-images/blob/main/images/macos/xcode-27-arm64-Readme.md
    runs-on: xcode-27
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Xcode
        run: |
          set -euo pipefail
          XCODE_PATH="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$XCODE_PATH" ]; then
            echo "::error::Requested Xcode not installed: $XCODE_PATH"
            exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
          ACTUAL_XCODE_VERSION=$(xcodebuild -version | awk 'NR == 1 { print $2 }')
          if [ "$ACTUAL_XCODE_VERSION" != "$XCODE_VERSION" ]; then
            echo "::error::Expected Xcode $XCODE_VERSION, got $ACTUAL_XCODE_VERSION"
            exit 1
          fi
          xcrun swift --version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install CocoaPods dependencies if needed
        run: |
          set -euo pipefail
          if [ -f Podfile ]; then
            if [ -f Gemfile ]; then
              bundle install
              bundle exec pod install
            else
              pod install
            fi
          fi

      - name: Install Certificate and Provisioning Profile
        env:
          CERTIFICATE_BASE64: 
          CERTIFICATE_PASSWORD: "123"
          PROVISIONING_PROFILE_BASE64: 
          KEYCHAIN_PASSWORD: "111111"
        run: |
          set -euo pipefail
          echo "::add-mask::$CERTIFICATE_BASE64"
          echo "::add-mask::$CERTIFICATE_PASSWORD"
          echo "::add-mask::$PROVISIONING_PROFILE_BASE64"
          echo "::add-mask::$KEYCHAIN_PASSWORD"

          KEYCHAIN_PATH="$RUNNER_TEMP/swift-build.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/swift-certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/swift-profile.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/swift-profile.plist"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "PROFILE_PLIST=$PROFILE_PLIST" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          # 保留登录钥匙串，以便验证 Apple 证书信任链。
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          security default-keychain -s "$KEYCHAIN_PATH"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$CERTIFICATE_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          printf '%s' "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PROFILE_PLIST")
          # 同时兼容 Xcode 16 之后及旧版的描述文件目录。
          for PROFILE_DIR in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            mkdir -p "$PROFILE_DIR"
            cp "$PROFILE_PATH" "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"
          done
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      - name: Prepare native iOS project and signing
        id: project
        run: python3 .github/scripts/prepare-ios.py

      - name: Archive and export IPA
        env:
          CONTAINER: ${{ steps.project.outputs.container }}
          CONTAINER_TYPE: ${{ steps.project.outputs.container_type }}
          SCHEME: ${{ steps.project.outputs.scheme }}
        run: |
          set -euo pipefail
          mkdir -p build/ios
          xcodebuild "-$CONTAINER_TYPE" "$CONTAINER" \
            -scheme "$SCHEME" -configuration "$IOS_CONFIGURATION" \
            -destination 'generic/platform=iOS' \
            -archivePath "$GITHUB_WORKSPACE/build/ios/App.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/swift-derived-data" \
            -resultBundlePath "$GITHUB_WORKSPACE/build/ios/Archive.xcresult" \
            archive 2>&1 | tee build/ios/archive.log
          xcodebuild -exportArchive \
            -archivePath "$GITHUB_WORKSPACE/build/ios/App.xcarchive" \
            -exportPath "$GITHUB_WORKSPACE/build/ios/ipa" \
            -exportOptionsPlist ExportOptions.plist 2>&1 | tee build/ios/export.log

      - name: Save IPA and debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: swift-ios-release
          if-no-files-found: error
          path: |
            build/ios/ipa/*.ipa
            build/ios/App.xcarchive/dSYMs/

      - name: Upload to App Store Connect
        id: upload
        env:
          APPLE_USERNAME: WilliamMurray9793@hotmail.com
          APPLE_PASSWORD: bvxa-vedo-dkox-xcgd
          APPLE_ASC_PROVIDER: 487C73QLBW
        run: |
          set -euo pipefail
          echo "::add-mask::$APPLE_USERNAME"
          echo "::add-mask::$APPLE_PASSWORD"
          shopt -s nullglob
          IPA_FILES=(build/ios/ipa/*.ipa)
          if [ "${#IPA_FILES[@]}" -ne 1 ]; then
            echo '::error::Expected exactly one exported IPA.'
            exit 1
          fi
          IPA_PATH="$GITHUB_WORKSPACE/${IPA_FILES[0]}"

          upload_with_itsm() {
            # if 中调用的函数不会自动触发 set -e，准备步骤需显式返回失败。
            TRANSPORTER_DIRECTORY="$RUNNER_TEMP/itsm"
            git clone --depth 1 https://github.com/ZhangLi1984/itsm.git "$TRANSPORTER_DIRECTORY" || return $?
            TRANSPORTER="$TRANSPORTER_DIRECTORY/bin/iTMSTransporter"
            if [ ! -f "$TRANSPORTER" ]; then
              echo '::warning::itsm repository does not contain bin/iTMSTransporter.'
              return 1
            fi
            chmod +x "$TRANSPORTER" || return $?
            "$TRANSPORTER" -m upload -assetFile "$IPA_PATH" \
              -u "$APPLE_USERNAME" -p "$APPLE_PASSWORD" -asc_provider "$APPLE_ASC_PROVIDER"
          }

          if upload_with_itsm; then
            echo 'Upload completed using itsm.'
          else
            TRANSPORTER_STATUS=$?
            echo "::warning::itsm failed (exit $TRANSPORTER_STATUS); retrying upload using xcrun altool."
            xcrun altool --upload-app \
              --type ios \
              --file "$IPA_PATH" \
              --username "$APPLE_USERNAME" \
              --password "$APPLE_PASSWORD"
            echo 'Upload completed using altool.'
          fi

      - name: Save build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-ios-diagnostics
          if-no-files-found: ignore
          path: |
            build/ios/*.log
            build/ios/Archive.xcresult/

      - name: Clean temporary signing files
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
          if [ -n "${PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi
          rm -f "$RUNNER_TEMP/swift-certificate.p12" "$RUNNER_TEMP/swift-profile.mobileprovision" "$RUNNER_TEMP/swift-profile.plist"

      - name: Clean project and update README
        if: ${{ success() && steps.upload.outcome == 'success' && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git rm -r -f --ignore-unmatch -- .
          printf 'Last updated: %s\n' "$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S %z')" > README.md
          git add -- README.md
          git commit -m "清空项目，仅保留更新时间戳的 README [skip ci]"
          git push origin HEAD:main
