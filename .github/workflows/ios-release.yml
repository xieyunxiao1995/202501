name: Build and Distribute Swift iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Archive and upload GeckConnent
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
          xcodebuild -version

      - name: Install distribution certificate and both provisioning profiles
        env:
          CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          : "${CERTIFICATE_BASE64:?Set CERTIFICATE_BASE64 in GitHub Actions secrets}"
          : "${CERTIFICATE_PASSWORD:?Set CERTIFICATE_PASSWORD in GitHub Actions secrets}"
          umask 077
          keychain="$RUNNER_TEMP/app-signing.keychain-db"
          certificate="$RUNNER_TEMP/distribution.p12"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          trap 'rm -f "$certificate"' EXIT

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          security import "$certificate" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          python3 .github/scripts/prepare-ios.py "$keychain"

      - name: Archive and export IPA
        run: |
          set -euo pipefail
          mkdir -p build/ios
          xcodebuild -project GeckoHop.xcodeproj -scheme GeckoHop -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$GITHUB_WORKSPACE/build/ios/App.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/swift-derived-data" \
            -resultBundlePath "$GITHUB_WORKSPACE/build/ios/Archive.xcresult" \
            archive 2>&1 | tee build/ios/archive.log
          test -d build/ios/App.xcarchive/Products/Applications/GeckConnent.app/PlugIns/PacketTunnel.appex
          xcodebuild -exportArchive \
            -archivePath "$GITHUB_WORKSPACE/build/ios/App.xcarchive" \
            -exportPath "$GITHUB_WORKSPACE/build/ios/ipa" \
            -exportOptionsPlist ExportOptions.plist 2>&1 | tee build/ios/export.log

      - name: Save IPA and debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: swift-ios-release
          if-no-files-found: error
          path: |
            build/ios/ipa/*.ipa
            build/ios/App.xcarchive/dSYMs/

      - name: Upload to App Store Connect
        env:
          APPLE_USERNAME: ${{ secrets.APPLE_USERNAME }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          ASC_PROVIDER_PUBLIC_ID: ${{ vars.ASC_PROVIDER_PUBLIC_ID }}
        run: |
          set -euo pipefail
          : "${APPLE_USERNAME:?Set APPLE_USERNAME in GitHub Actions secrets}"
          : "${APPLE_PASSWORD:?Set APPLE_PASSWORD in GitHub Actions secrets}"
          shopt -s nullglob
          ipa_files=(build/ios/ipa/*.ipa)
          if [ "${#ipa_files[@]}" -ne 1 ]; then
            echo '::error::Expected exactly one exported IPA.'
            exit 1
          fi
          upload_args=(--upload-app --type ios --file "${ipa_files[0]}"
                       --username "$APPLE_USERNAME" --password @env:APPLE_PASSWORD)
          if [ -n "$ASC_PROVIDER_PUBLIC_ID" ]; then
            upload_args+=(--provider-public-id "$ASC_PROVIDER_PUBLIC_ID")
          fi
          xcrun altool "${upload_args[@]}"

      - name: Save build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-ios-diagnostics
          if-no-files-found: ignore
          path: |
            build/ios/*.log
            build/ios/Archive.xcresult/

      - name: Remove temporary signing keychain
        if: always()
        run: |
          keychain="$RUNNER_TEMP/app-signing.keychain-db"
          if [ -f "$keychain" ]; then
            security delete-keychain "$keychain"
          fi

  cleanup-main:
    name: Keep only a timestamp README on main
    needs: build
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Clear project files and update README
        run: |
          set -euo pipefail
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git rm -r -f --ignore-unmatch -- .
          printf 'Last updated: %s\n' "$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S %z')" > README.md
          git add -- README.md
          git commit -m '清空项目，仅保留更新时间戳的 README [skip ci]'
          git push origin HEAD:refs/heads/main
