name: GeckoHop
options:
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.4.10"
    CURRENT_PROJECT_VERSION: "636"
    CODE_SIGN_STYLE: Automatic
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  GeckConnent:
    type: application
    platform: iOS
    sources:
      - GeckoHop
    dependencies:
      - target: PacketTunnel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.geckconnent.app
        CODE_SIGN_STYLE: Manual
        "DEVELOPMENT_TEAM[sdk=iphoneos*]": SC6T3VGHGX
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Distribution
        "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": SC6T3VGHGX.com.geckconnent.app
        INFOPLIST_FILE: Config/App.plist
        CODE_SIGN_ENTITLEMENTS: Config/VPN.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        VEIL_API_BASE_URL: "https://api-geckohop.bigbaer77.top"
        SWIFT_STRICT_CONCURRENCY: complete
  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - PacketTunnel/PacketTunnelProvider.swift
    dependencies:
      - framework: PacketTunnel/Frameworks/VeilCore.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.geckconnent.app.PacketTunnel
        CODE_SIGN_STYLE: Manual
        "DEVELOPMENT_TEAM[sdk=iphoneos*]": SC6T3VGHGX
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Distribution
        "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": SC6T3VGHGX.com.geckconnent.app.PacketTunnel
        INFOPLIST_FILE: PacketTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/VPN.entitlements
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
  GeckConnentTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - GeckoHopTests
    dependencies:
      - target: GeckConnent
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.geckconnent.app.Tests
  GeckConnentUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - GeckoHopUITests
    dependencies:
      - target: GeckConnent
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.geckconnent.app.UITests
schemes:
  GeckoHop:
    build:
      targets:
        GeckConnent: all
    test:
      targets:
        - GeckConnentTests
        - GeckConnentUITests
